# Aula 15: testes + portao de cobertura (JaCoCo) a cada push/PR. Actions
# fixadas por SHA (tag e mutavel), as mesmas do seguranca.yml.
name: Testes

on:
  push:
    branches: [27-develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Sem segredos: o perfil dev tem chaves locais e os testes usam H2 em memoria.
      - run: ./mvnw -B clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorio-cobertura
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 14
