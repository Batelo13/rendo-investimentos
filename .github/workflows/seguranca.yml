# Portao de seguranca semanal (Modulo 11): os mesmos scripts que rodam na maquina
# do desenvolvedor, para pegar CVE nova em dependencia ou regra nova do semgrep
# mesmo sem commit. Actions fixadas por SHA (tag e mutavel); versao no comentario.
name: Seguranca

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 06:00 em Brasilia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (SAST, segredos, bytecode, dependencias, specs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks varre o historico inteiro
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @fission-ai/openspec@1.8.0
      - run: bash scripts/security_gate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorios-gate
          path: security/reports/
          retention-days: 30

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # O ZAP roda como uid 1000 no container; o runner usa outro uid.
      - run: mkdir -p security/reports && chmod -R a+w security
      - run: bash scripts/dast_zap.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorios-dast
          path: security/reports/
          retention-days: 30
