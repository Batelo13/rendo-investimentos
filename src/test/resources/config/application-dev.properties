# Testes usam banco em memoria proprio, recriado a cada contexto -- nunca o
# arquivo ./data do desenvolvedor. classpath:/config/ tem precedencia sobre o
# application-dev.properties de src/main/resources.
spring.datasource.url=jdbc:h2:mem:rendo-testes;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Testes nunca enviam email de verdade, mesmo que o .env do desenvolvedor
# tenha MAIL_ENABLED=true (o .env e importado por application.properties).
app.mail.enabled=false
