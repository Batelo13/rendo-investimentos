# H2 em ARQUIVO (./data, fora do Git): os cadastros sobrevivem ao reinicio do
# servidor. Os testes trocam isto por um banco em memoria proprio
# (src/test/resources/config/application-dev.properties).
spring.datasource.url=jdbc:h2:file:./data/rendo-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Chave do HMAC do CPF. Valor fixo SO para desenvolvimento local; fora do dev
# CPF_HASH_KEY e obrigatoria (sem padrao) e a aplicacao nao sobe sem ela.
# Chave do JWT: valor fixo SO para desenvolvimento local (fora do dev JWT_SECRET e obrigatoria).
app.jwt.secret=${JWT_SECRET:dev-local-jwt-somente-desenvolvimento-nunca-producao}
app.seguranca.cpf-hash-key=${CPF_HASH_KEY:dev-local-somente-desenvolvimento-nunca-producao}
spring.jpa.show-sql=true
spring.h2.console.enabled= true
spring.h2.console.path=/h2-console

# Chaves de APIs externas - nunca hardcoded. Sobrescreva via variavel de ambiente.
brapi.api.token=${BRAPI_API_TOKEN:}
twelvedata.api.key=${TWELVEDATA_API_KEY:demo}

# Em dev, nao dispara email real por padrao (evita exigir SMTP local so pra
# testar o cadastro) -- o codigo de verificacao continua sendo gerado e
# logado normalmente. Sobrescreva via .env se quiser testar envio de verdade.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.log-codigo=${MAIL_LOG_CODE:true}
