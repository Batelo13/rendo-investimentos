spring.datasource.url=jdbc:h2:mem:rendo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled= true
spring.h2.console.path=/h2-console

# Chaves de APIs externas - nunca hardcoded. Sobrescreva via variavel de ambiente.
brapi.api.token=${BRAPI_API_TOKEN:}
twelvedata.api.key=${TWELVEDATA_API_KEY:demo}

# Em dev, nao dispara email real por padrao (evita exigir SMTP local so pra
# testar o cadastro) -- o codigo de verificacao continua sendo gerado e
# logado normalmente. Sobrescreva via .env se quiser testar envio de verdade.
app.mail.enabled=${MAIL_ENABLED:false}
