spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/rendodb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=false

# Chaves de APIs externas - nunca hardcoded. Sobrescreva via variavel de ambiente.
brapi.api.token=${BRAPI_API_TOKEN:}
twelvedata.api.key=${TWELVEDATA_API_KEY:demo}

# SMTP para envio real do codigo de verificacao de email. As propriedades de
# conexao (host/porta/auth/STARTTLS) ficam em application.properties (base) --
# valem em qualquer profile. Sem as variaveis no .env, o Spring sobe com os
# defaults (nao funcionais) -- por isso MAIL_ENABLED deve ficar false em .env
# ate haver um SMTP real configurado.
