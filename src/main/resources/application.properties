spring.application.name=rendo
spring.profiles.active=dev

# Le .env (formato igual a .properties: KEY=VALUE) se existir na raiz do
# projeto. "[.properties]" forca o Spring a usar o parser de .properties,
# ja que o arquivo .env nao tem essa extensao. "optional:" evita erro quando
# o arquivo nao existe (ex.: ambiente de CI). Nunca comitado -- ver .gitignore.
spring.config.import=optional:file:.env[.properties]

# Circuit breaker (Resilience4j) para as chamadas as APIs externas
# (BrasilAPI, ViaCEP, Twelve Data, brapi). Um "nao encontrado" (CNPJ/ticker
# invalido) e resultado de negocio, nao falha de infraestrutura -- por isso
# RecursoNaoEncontradoException fica de fora da contagem que abre o circuito.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions=com.curso.gestaoinvestimentos.exception.RecursoNaoEncontradoException
resilience4j.circuitbreaker.instances.cnpj.base-config=default
resilience4j.circuitbreaker.instances.cep.base-config=default
resilience4j.circuitbreaker.instances.cambio.base-config=default
resilience4j.circuitbreaker.instances.cotacaoEua.base-config=default
resilience4j.circuitbreaker.instances.cotacaoBrasil.base-config=default
