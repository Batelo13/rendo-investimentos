spring.application.name=rendo
spring.profiles.active=dev

# Le .env (formato igual a .properties: KEY=VALUE) se existir na raiz do
# projeto. "[.properties]" forca o Spring a usar o parser de .properties,
# ja que o arquivo .env nao tem essa extensao. "optional:" evita erro quando
# o arquivo nao existe (ex.: ambiente de CI). Nunca comitado -- ver .gitignore.
spring.config.import=optional:file:.env[.properties]
